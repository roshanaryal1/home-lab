# macOS newsyslog rules for the launchd logs in /var/log/homelab (#349).
# Install and dry-run steps: ops/runbook-lab-account-and-daemons.md, "Log rotation".
# Fields: logfile, owner:group, mode, count, size in KB, when, flags.
# Owner and mode are the runbook's for /var/log/homelab (owner lab, mode 700).
# The colon stays even though no group is named. Rotate at 10 MB, keep five copies,
# and compress them with bzip2 (flag J).
/var/log/homelab/*.log lab: 700 5 10240 * GJ
/var/log/homelab/*.err lab: 700 5 10240 * GJ
