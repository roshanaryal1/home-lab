# macOS newsyslog rules for the launchd logs in /var/log/homelab (#349).
# Install and dry-run steps: ops/runbook-lab-account-and-daemons.md, "Log rotation".
# Fields: logfile, owner:group, mode, count, size in KB, when, flags.
# The files are owned by lab and private to it (mode 600). The colon stays even
# though no group is named. Rotate at 10 MB, keep five copies compressed with bzip2
# (J), and signal no process (N).
#
# Only the scheduled jobs are here. launchd opens their log files again at every
# run, so a rotated copy is not written to again. chat, keepawake and supervisor
# run with KeepAlive and hold their files open, so they are left out: a daemon
# would keep writing to the rotated copy, and compressing would delete it. Their
# files stay small. The supervisor's full log is its own rotating file, and its
# stderr gets only warnings and errors.
/var/log/homelab/backup.log        lab: 600 5 10240 * JN
/var/log/homelab/backup.err        lab: 600 5 10240 * JN
/var/log/homelab/heartbeat.log     lab: 600 5 10240 * JN
/var/log/homelab/heartbeat.err     lab: 600 5 10240 * JN
/var/log/homelab/selftest.log      lab: 600 5 10240 * JN
/var/log/homelab/selftest.err      lab: 600 5 10240 * JN
/var/log/homelab/statuscheck.log   lab: 600 5 10240 * JN
/var/log/homelab/statuscheck.err   lab: 600 5 10240 * JN
/var/log/homelab/tick.log          lab: 600 5 10240 * JN
/var/log/homelab/tick.err          lab: 600 5 10240 * JN
/var/log/homelab/watchdog.log      lab: 600 5 10240 * JN
/var/log/homelab/watchdog.err      lab: 600 5 10240 * JN
/var/log/homelab/weekly-eval.log   lab: 600 5 10240 * JN
/var/log/homelab/weekly-eval.err   lab: 600 5 10240 * JN
