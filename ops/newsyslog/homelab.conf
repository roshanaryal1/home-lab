# macOS newsyslog rules for the launchd logs in /var/log/homelab (#349).
# Install and dry-run steps: ops/runbook-lab-account-and-daemons.md, "Log rotation".
# Fields: logfile, owner:group, mode, count, size in KB, when, flags.
# The files are owned by lab and private to it (mode 600). The colon stays even
# though no group is named. Rotate at 10 MB and keep five copies.
# Flags: G, the name is a pattern. N, no process is signaled after a rotation.
# The rotated copies are not compressed. chat, keepawake and supervisor run with
# KeepAlive and keep writing to the renamed copy until they restart. Compressing
# would delete that copy, and what they write after it would be lost.
/var/log/homelab/*.log lab: 600 5 10240 * GN
/var/log/homelab/*.err lab: 600 5 10240 * GN
