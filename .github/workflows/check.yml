name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Both platforms on purpose. Linux is where the fail-closed path is
    # exercised, since Seatbelt does not exist there and the sandbox must
    # refuse rather than downgrade. macOS is the actual deployment
    # target, and the only place real confinement can be tested at all.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install from the lockfile
        # --locked fails if uv.lock is out of date with pyproject.toml, so
        # CI never resolves a fresh set of versions. The interpreter is the
        # exact patch in .python-version, uv-managed only (pyproject
        # [tool.uv]), which is also what the Mac mini runs (ADR 0002).
        run: uv sync --locked --extra dev
      - name: Record runtime versions
        run: uv run python -c "import sqlite3, sys; print('python', sys.version.split()[0], 'sqlite', sqlite3.sqlite_version)"
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run python -m pytest tests/ -q
      - name: Safety properties must still be covered
        # The two load-bearing guarantees are that a crash never blindly
        # replays a non-idempotent task, and that the heavy inference slot is
        # never breached. Deleting the tests that prove those would otherwise
        # be a silent green build, so assert the coverage still exists.
        run: |
          SAFETY="idempotent or destructive or heavy_task"
          uv run python -m pytest tests/ -q -k "$SAFETY" --no-header
          FOUND=$(uv run python -m pytest tests/ --collect-only -q -k "$SAFETY" 2>/dev/null | grep -c "::")
          echo "safety tests found: $FOUND"
          if [ "$FOUND" -lt 6 ]; then
            echo "expected at least 6 safety tests, found $FOUND"
            exit 1
          fi
