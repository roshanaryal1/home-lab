name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Both platforms on purpose. Linux is where the fail-closed path is
    # exercised, since Seatbelt does not exist there and the sandbox must
    # refuse rather than downgrade. macOS is the actual deployment
    # target, and the only place real confinement can be tested at all.
    strategy:
      fail-fast: false
      matrix:
        # Named images, not -latest aliases: macos-latest moved to macOS 26
        # in 2026 without any change here. The mini runs macOS 27, which
        # has no hosted image yet; the nightly self-test there covers it (6.4).
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install from the lockfile
        # --locked fails if uv.lock is out of date with pyproject.toml, so
        # CI never resolves a fresh set of versions. The interpreter is the
        # exact patch in .python-version, uv-managed only (pyproject
        # [tool.uv]), which is also what the Mac mini runs (ADR 0002).
        run: uv sync --locked --extra dev
      - name: Record runtime versions
        run: uv run python -c "import sqlite3, sys; print('python', sys.version.split()[0], 'sqlite', sqlite3.sqlite_version)"
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test with coverage
        run: uv run coverage run -m pytest tests/ -q
      - name: Coverage floor on the safety-critical modules
        # Each module must reach the floor on its own, so a well-covered
        # module cannot hide a neglected one.
        run: |
          for module in queue policy broker sandbox container chat audit artifacts memory handlers/workspace handlers/web handlers/git_read handlers/skill_run handlers/mcp_call skills skillstore prereg mcp; do
            uv run coverage report --include="lab/$module.py" --fail-under=90 --skip-empty || exit 1
          done
      - name: Safety properties must still be covered
        # Tests carrying the safety marker prove the load-bearing
        # guarantees: a crash never blindly replays a non-idempotent task,
        # the heavy inference slot is never breached, and the reproduced
        # defects R01 to R11 stay fixed, and a chat message cannot reach an
        # approve-tier tool or act for any chat but the paired one. Deleting
        # them would otherwise be a silent green build, so assert the marked
        # set has not shrunk.
        run: |
          uv run python -m pytest tests/ -q -m safety --no-header
          FOUND=$(uv run python -m pytest tests/ --collect-only -q -m safety 2>/dev/null | grep -c "::")
          echo "safety tests found: $FOUND"
          if [ "$FOUND" -lt 595 ]; then
            echo "expected at least 595 safety tests, found $FOUND"
            exit 1
          fi

  workflow-audit:
    # Static audit of the workflows themselves: unpinned actions, template
    # injection, credential persistence. Fails the build on any finding.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: zizmor
        run: uvx zizmor@1.30.1 --offline .github/workflows

  secret-scan:
    # An independent full-history check that does not depend on any
    # GitHub setting: gitleaks, binary pinned by checksum. GitHub's own
    # secret scanning and push protection are repository settings.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
