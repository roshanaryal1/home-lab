name: scorecard

# OpenSSF Scorecard: an automated read on repository security hygiene
# (branch protection, pinned dependencies, token permissions, review,
# dependency updates). It needs a public repository to publish results.
# Findings appear in the Security tab and are not a merge gate.

on:
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # upload the SARIF results to code scanning
      id-token: write          # publish the result to the Scorecard API
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the results for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
