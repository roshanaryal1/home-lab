# Declared explicitly. Without it setuptools' legacy backend runs
# auto-discovery, finds lab/ and ops/ at the top level, and refuses to
# guess, so the project could not be installed at all. ops/ is shell
# scripts and a checklist, not a package.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-lab"
version = "0.1.0"
description = "24/7 local autonomous AI workstation, built to the reference architecture from the llm-architects study"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["lab"]

[tool.setuptools.package-data]
lab = ["schema.sql"]

[tool.uv]
# Only uv-managed (python-build-standalone) interpreters, never the
# runner's or Homebrew's. ADR 0002 chose uv-managed Python for
# rebuildability, and item 1.9 needs it: the setup-python builds on the
# GitHub runners link SQLite 3.45.1 (Linux) and 3.50.4 (macOS), both
# carrying the WAL-reset bug, while the managed build ships a fixed one.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Pinned explicitly so a local run and a CI run cannot disagree, which is
# exactly how the first CI run failed on rules that were never checked here.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PYI"]
# E402 was ignored because tests prepended to sys.path before importing
# the package. With the package installable (issue #29) that bootstrap is
# gone, so the exemption is gone with it.

[tool.pytest.ini_options]
testpaths = ["tests"]
